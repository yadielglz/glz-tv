plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "org.jetbrains.kotlin.plugin.compose"
}

android {
    namespace "com.glztv.app"
    compileSdk 36

    defaultConfig {
        applicationId "com.glztv.app"
        minSdk 24
        targetSdk 36
        versionCode providers.gradleProperty("releaseVersionCode").map { it.toInteger() }.getOrElse(2099070)
        versionName providers.gradleProperty("releaseVersionName").getOrElse("2.99.70")
    }

    signingConfigs {
        release {
            def signingPath = System.getenv("ANDROID_KEYSTORE_PATH")
            if (signingPath) {
                storeFile file(signingPath)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv("ANDROID_KEYSTORE_PATH")) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
    buildFeatures {
        compose true
        buildConfig true
    }
}

dependencies {
    def composeBom = platform("androidx.compose:compose-bom:2026.06.00")
    implementation composeBom
    implementation "androidx.activity:activity-compose:1.13.0"
    implementation "androidx.core:core-ktx:1.17.0"
    implementation "androidx.work:work-runtime-ktx:2.11.2"
    implementation "androidx.profileinstaller:profileinstaller:1.4.1"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.material:material-icons-extended"
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-tooling-preview"
    debugImplementation "androidx.compose.ui:ui-tooling"
    implementation "androidx.media3:media3-exoplayer:1.8.0"
    implementation "androidx.media3:media3-exoplayer-hls:1.8.0"
    implementation "androidx.media3:media3-ui:1.8.0"
    implementation "androidx.media3:media3-session:1.8.0"
    implementation "androidx.tvprovider:tvprovider:1.0.0"
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation "io.coil-kt.coil3:coil-compose:3.5.0"
    implementation "io.coil-kt.coil3:coil-network-okhttp:3.5.0"
    implementation "com.google.zxing:core:3.5.4"
    testImplementation "junit:junit:4.13.2"
}
