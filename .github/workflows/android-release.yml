name: Signed Android release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix (for example, 1.48.100)
        required: true
        type: string
      publish_release:
        description: Publish or update the GitHub Release for this version
        required: false
        default: true
        type: boolean
  push:
    branches:
      - "release/v*"
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and sign GLZ TV
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: roku/package-lock.json

      - name: Resolve version
        id: version
        shell: bash
        env:
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          ref_version="${GITHUB_REF_NAME##*/}"
          version="${MANUAL_VERSION:-${ref_version#v}}"
          if [[ "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)\.([0-9]+)(M)?(-[0-9A-Za-z.-]+)?$ ]]; then
            p1="${BASH_REMATCH[1]}"
            p2="${BASH_REMATCH[2]}"
            p3="${BASH_REMATCH[3]}"
            p4="${BASH_REMATCH[4]}"
            mobile_flag="${BASH_REMATCH[5]:-}"
            suffix="${BASH_REMATCH[6]:-}"
            version_code=$((10#$p1 * 100000 + 10#$p2 * 1000 + 10#$p3 * 100 + 10#$p4))
            roku_major=$((10#$p1))
            roku_minor=$((10#$p2))
            roku_build=$((10#$p3 * 100 + 10#$p4))
          elif [[ "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(M)?(-[0-9A-Za-z.-]+)?$ ]]; then
            major="${BASH_REMATCH[1]}"
            minor="${BASH_REMATCH[2]}"
            patch="${BASH_REMATCH[3]}"
            mobile_flag="${BASH_REMATCH[4]:-}"
            suffix="${BASH_REMATCH[5]:-}"
            subpatch=0
            if [[ "$suffix" =~ ^-([0-9]+)$ ]]; then
              subpatch="${BASH_REMATCH[1]}"
            fi
            version_code=$((10#$major * 1000000 + 10#$minor * 1000 + 10#$patch + 10#$subpatch))
            roku_major=$((10#$major))
            roku_minor=$((10#$minor))
            roku_build=$((10#$patch))
          else
            echo "Version must use major.minor.patch[M][-suffix] format." >&2
            exit 1
          fi
          is_mobile="false"
          if [[ "$mobile_flag" == "M" || "$suffix" == "-mobile" || "$suffix" == -mobile-* ]]; then
            is_mobile="true"
          fi
          echo "name=$version" >> "$GITHUB_OUTPUT"
          echo "code=$version_code" >> "$GITHUB_OUTPUT"
          echo "major=$roku_major" >> "$GITHUB_OUTPUT"
          echo "minor=$roku_minor" >> "$GITHUB_OUTPUT"
          echo "build=$roku_build" >> "$GITHUB_OUTPUT"
          echo "is_mobile=$is_mobile" >> "$GITHUB_OUTPUT"

      - name: Restore signing keystore
        shell: bash
        env:
          SIGNING_KEY_BASE64: ${{ secrets.ANDROID_SIGNING_KEY_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$SIGNING_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/glz-tv-release.jks"
          chmod 600 "$RUNNER_TEMP/glz-tv-release.jks"

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/glz-tv-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            -PreleaseVersionName=${{ steps.version.outputs.name }} \
            -PreleaseVersionCode=${{ steps.version.outputs.code }} \
            -PmobileBuild=${{ steps.version.outputs.is_mobile }}

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk -name '*release.apk' -type f -print -quit)"
          test -n "$apk"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --verbose --print-certs "$apk"
          cp "$apk" "GLZ-TV-${{ steps.version.outputs.name }}.apk"
          sha256sum "GLZ-TV-${{ steps.version.outputs.name }}.apk" > "GLZ-TV-${{ steps.version.outputs.name }}.apk.sha256"

      - name: Inject version into Roku manifest
        if: steps.version.outputs.is_mobile != 'true'
        shell: bash
        env:
          ROKU_MAJOR: ${{ steps.version.outputs.major }}
          ROKU_MINOR: ${{ steps.version.outputs.minor }}
          ROKU_BUILD: ${{ steps.version.outputs.build }}
          GLZ_VERSION: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          sed -i \
            -e "s/^major_version=.*/major_version=${ROKU_MAJOR}/" \
            -e "s/^minor_version=.*/minor_version=${ROKU_MINOR}/" \
            -e "s/^build_version=.*/build_version=${ROKU_BUILD}/" \
            -e "s/^glz_version=.*/glz_version=${GLZ_VERSION}/" \
            roku/manifest
          grep -E '^(major_version|minor_version|build_version|glz_version)=' roku/manifest

      - name: Build and test Roku package
        if: steps.version.outputs.is_mobile != 'true'
        shell: bash
        working-directory: roku
        run: |
          set -euo pipefail
          npm ci
          npm test
          npm run build

      - name: Package Roku release artifact
        if: steps.version.outputs.is_mobile != 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -f roku/dist/Glz-TV-Roku.zip
          cp roku/dist/Glz-TV-Roku.zip "Glz-TV-Roku-${{ steps.version.outputs.name }}.zip"
          sha256sum "Glz-TV-Roku-${{ steps.version.outputs.name }}.zip" > "Glz-TV-Roku-${{ steps.version.outputs.name }}.zip.sha256"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: GLZ-TV-${{ steps.version.outputs.name }}
          path: |
            GLZ-TV-${{ steps.version.outputs.name }}.apk
            GLZ-TV-${{ steps.version.outputs.name }}.apk.sha256
            Glz-TV-Roku-${{ steps.version.outputs.name }}.zip
            Glz-TV-Roku-${{ steps.version.outputs.name }}.zip.sha256
          if-no-files-found: warn

      - name: Generate release notes
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
        env:
          CURRENT_TAG: v${{ steps.version.outputs.name }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'EOF'
          const { execFileSync } = require('node:child_process');
          const { writeFileSync } = require('node:fs');

          const currentTag = process.env.CURRENT_TAG || '';
          let prevTag = '';
          try {
            prevTag = execFileSync(
              'git',
              ['describe', '--tags', '--abbrev=0', '--match', 'v*', '--exclude', currentTag, 'HEAD'],
              { encoding: 'utf8', stdio: ['ignore', 'pipe', 'ignore'] }
            ).trim();
          } catch {
            prevTag = '';
          }

          const logArgs = prevTag
            ? ['log', '--no-merges', `${prevTag}..HEAD`, '--pretty=format:%s']
            : ['log', '--no-merges', '-n', '30', '--pretty=format:%s'];
          const rawSubjects = execFileSync('git', logArgs, { encoding: 'utf8' })
            .split(/\r?\n/)
            .map((line) => line.trim())
            .filter(Boolean);

          const whatsNew = [];
          const improvements = [];
          const seen = new Set();

          function cleanMessage(raw) {
            let msg = raw
              .replace(/^(?:feat|fix|perf|refactor)(?:\([^)]*\))?!?:\s*/i, '')
              .replace(/\s*\(#\d+\)/g, '')
              .replace(/\s*(?:\(|\[)?\b[0-9a-f]{7,40}\b(?:\)|\])?/gi, '')
              .replace(/\s*(?:\(\s*by\s+@[A-Za-z0-9-]+\s*\)|\bby\s+@[A-Za-z0-9-]+|@[A-Za-z0-9-]+)/gi, '')
              .replace(/https?:\/\/\S+/gi, '')
              .replace(/\s+/g, ' ')
              .trim()
              .replace(/[.,;:\s-]+$/, '');
            if (!msg) return '';
            return msg.charAt(0).toUpperCase() + msg.slice(1);
          }

          for (const subject of rawSubjects) {
            if (/\[(?:skip ci|ci skip)\]/i.test(subject)) continue;
            if (/^Merge\b/i.test(subject)) continue;
            if (/^(?:chore|ci|build|docs|style|test|revert)(?:\([^)]*\))?!?:/i.test(subject)) continue;

            const isFeat = /^feat(?:\([^)]*\))?!?:/i.test(subject);
            const isImprovement = /^(?:fix|perf|refactor)(?:\([^)]*\))?!?:/i.test(subject);
            if (!isFeat && !isImprovement) continue;

            const cleaned = cleanMessage(subject);
            if (!cleaned) continue;
            const key = cleaned.toLowerCase();
            if (seen.has(key)) continue;
            seen.add(key);

            if (isFeat) {
              whatsNew.push(cleaned);
            } else {
              improvements.push(cleaned);
            }
          }

          const sections = [];
          if (whatsNew.length > 0) {
            sections.push("### What's New\n\n" + whatsNew.map((item) => `- ${item}`).join('\n'));
          }
          if (improvements.length > 0) {
            sections.push('### Improvements & Fixes\n\n' + improvements.map((item) => `- ${item}`).join('\n'));
          }
          if (sections.length === 0) {
            sections.push('### Improvements & Fixes\n\n- General stability, performance, and reliability improvements across GLZ TV.');
          }

          const notes = sections.join('\n\n') + '\n';
          writeFileSync('release-notes.md', notes, 'utf8');
          console.log(notes);
          EOF

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v${{ steps.version.outputs.name }}"
          apk="GLZ-TV-${{ steps.version.outputs.name }}.apk"
          checksum="$apk.sha256"
          roku_zip="Glz-TV-Roku-${{ steps.version.outputs.name }}.zip"
          roku_checksum="$roku_zip.sha256"
          assets=("$apk" "$checksum")
          if [[ "${{ steps.version.outputs.is_mobile }}" != "true" ]]; then
            assets+=("$roku_zip" "$roku_checksum")
          fi
          title="GLZ TV ${{ steps.version.outputs.name }}"
          if [[ "${{ steps.version.outputs.is_mobile }}" == "true" ]]; then
            title="GLZ TV Mobile ${{ steps.version.outputs.name }}"
          fi
          release_args=(--title "$title" --notes-file release-notes.md)
          if [[ "${{ steps.version.outputs.is_mobile }}" == "true" || "${{ steps.version.outputs.name }}" == *-testing* || "${{ steps.version.outputs.name }}" == *-weekly* || "${{ steps.version.outputs.name }}" == *-biweekly* || "${{ steps.version.outputs.name }}" == *-monthly* || "${{ steps.version.outputs.name }}" == *-beta* || "${{ steps.version.outputs.name }}" == *-family* || "${{ steps.version.outputs.name }}" == *-rc* || "${{ steps.version.outputs.name }}" == *-mobile* ]]; then
            release_args+=(--prerelease --latest=false)
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
            gh release edit "$tag" "${release_args[@]}"
          else
            create_args=("$tag" "${assets[@]}" "${release_args[@]}")
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then
              gh release create "${create_args[@]}" --verify-tag
            else
              gh release create "${create_args[@]}" --target "$GITHUB_SHA"
            fi
          fi
