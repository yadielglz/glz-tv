name: Signed Android release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix (for example, 1.7.0)
        required: true
        type: string
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and sign GLZ TV
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve version
        id: version
        shell: bash
        env:
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${MANUAL_VERSION:-${GITHUB_REF_NAME#v}}"
          if [[ ! "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Version must use major.minor.patch[-suffix] format." >&2
            exit 1
          fi
          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"
          suffix="${BASH_REMATCH[4]:-}"
          subpatch=0
          if [[ "$suffix" =~ ^-([0-9]+)$ ]]; then
            subpatch="${BASH_REMATCH[1]}"
          fi
          version_code=$((10#$major * 1000000 + 10#$minor * 1000 + 10#$patch + 10#$subpatch))
          echo "name=$version" >> "$GITHUB_OUTPUT"
          echo "code=$version_code" >> "$GITHUB_OUTPUT"

      - name: Restore signing keystore
        shell: bash
        env:
          SIGNING_KEY_BASE64: ${{ secrets.ANDROID_SIGNING_KEY_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$SIGNING_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/glz-tv-release.jks"
          chmod 600 "$RUNNER_TEMP/glz-tv-release.jks"

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/glz-tv-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >-
          ./gradlew
          assembleRelease
          -PreleaseVersionName=${{ steps.version.outputs.name }}
          -PreleaseVersionCode=${{ steps.version.outputs.code }}

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk -name '*release.apk' -type f -print -quit)"
          test -n "$apk"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --verbose --print-certs "$apk"
          cp "$apk" "GLZ-TV-${{ steps.version.outputs.name }}.apk"
          sha256sum "GLZ-TV-${{ steps.version.outputs.name }}.apk" > "GLZ-TV-${{ steps.version.outputs.name }}.apk.sha256"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: GLZ-TV-${{ steps.version.outputs.name }}
          path: |
            GLZ-TV-${{ steps.version.outputs.name }}.apk
            GLZ-TV-${{ steps.version.outputs.name }}.apk.sha256
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          "GLZ-TV-${{ steps.version.outputs.name }}.apk"
          "GLZ-TV-${{ steps.version.outputs.name }}.apk.sha256"
          --verify-tag
          --generate-notes
          --title "GLZ TV ${{ steps.version.outputs.name }}"
