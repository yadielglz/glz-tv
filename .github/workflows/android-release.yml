name: Signed Android release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix (for example, 1.7.0)
        required: true
        type: string
  push:
    branches:
      - "release/v*"
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: ${{ contains(github.ref_name, '-beta') }}

jobs:
  release:
    name: Build and sign GLZ TV
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve version
        id: version
        shell: bash
        env:
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          ref_version="${GITHUB_REF_NAME##*/}"
          version="${MANUAL_VERSION:-${ref_version#v}}"
          if [[ ! "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9A-Za-z]+)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Version must use major.minor.patch[-suffix] format." >&2
            exit 1
          fi
          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch_raw="${BASH_REMATCH[3]}"
          suffix="${BASH_REMATCH[4]:-}"
          patch_digits=$(echo "$patch_raw" | tr -dc '0-9')
          patch="${patch_digits:-0}"
          subpatch=0
          if [[ "$suffix" =~ ^-([0-9]+)$ ]]; then
            subpatch="${BASH_REMATCH[1]}"
          fi
          version_code=$((10#$major * 1000000 + 10#$minor * 1000 + 10#$patch + 10#$subpatch))
          echo "name=$version" >> "$GITHUB_OUTPUT"
          echo "code=$version_code" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate GlzHub logo settings
        working-directory: glzhub
        run: |
          npm ci --ignore-scripts
          npm run check
          node logo-style.test.mjs

      - name: Run Android unit tests
        run: ./gradlew testDebugUnitTest

      - name: Restore signing keystore
        shell: bash
        env:
          SIGNING_KEY_BASE64: ${{ secrets.ANDROID_SIGNING_KEY_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$SIGNING_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/glz-tv-release.jks"
          chmod 600 "$RUNNER_TEMP/glz-tv-release.jks"

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/glz-tv-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >-
          ./gradlew
          assembleRelease
          -PreleaseVersionName=${{ steps.version.outputs.name }}
          -PreleaseVersionCode=${{ steps.version.outputs.code }}

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk -name '*release.apk' -type f -print -quit)"
          test -n "$apk"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --verbose --print-certs "$apk"
          cp "$apk" "GLZ-TV-${{ steps.version.outputs.name }}.apk"
          sha256sum "GLZ-TV-${{ steps.version.outputs.name }}.apk" > "GLZ-TV-${{ steps.version.outputs.name }}.apk.sha256"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: GLZ-TV-${{ steps.version.outputs.name }}
          path: |
            GLZ-TV-${{ steps.version.outputs.name }}.apk
            GLZ-TV-${{ steps.version.outputs.name }}.apk.sha256
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v${{ steps.version.outputs.name }}"
          args=("$tag" "GLZ-TV-${{ steps.version.outputs.name }}.apk" "GLZ-TV-${{ steps.version.outputs.name }}.apk.sha256"
            --generate-notes --title "GLZ TV ${{ steps.version.outputs.name }}")
          if [[ "${{ steps.version.outputs.name }}" == *-beta* ]]; then
            args+=(--prerelease --latest=false)
            # A repeated Beta build replaces only this exact Beta version's assets.
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release upload "$tag" "GLZ-TV-${{ steps.version.outputs.name }}.apk" "GLZ-TV-${{ steps.version.outputs.name }}.apk.sha256" --clobber
              gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" -f sha="$GITHUB_SHA" -F force=true
              gh release edit "$tag" --prerelease --latest=false --title "GLZ TV ${{ steps.version.outputs.name }}"
              exit 0
            fi
          fi
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            gh release create "${args[@]}" --verify-tag
          else
            gh release create "${args[@]}" --target "$GITHUB_SHA"
          fi
