name: Deploy GlzHub Worker

on:
  push:
    branches: [main]
    paths:
      - "glzhub/**"
      - ".github/workflows/glzhub-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: glzhub-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: glzhub
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: glzhub/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Syntax check frontend scripts
        run: node --check public/app.js && node --check public/live-tv.js && node --check public/sw.js

      - name: Run unit tests
        run: npm test

      - name: Deploy GlzHub to Cloudflare Workers
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Skip deploy when Cloudflare secret is not configured
        if: ${{ secrets.CLOUDFLARE_API_TOKEN == '' }}
        run: echo "::notice::CLOUDFLARE_API_TOKEN secret is not configured; skipping Cloudflare Worker deployment."
